<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABUJAR ONLINE TELEKOM - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  background:white;
  width:100%;
  max-width:500px;
  padding:35px;
  border-radius:20px;
  box-shadow:0 5px 25px #0002;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  font-size:22px;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  opacity:.8;
}

.error{
  color:red;
  text-align:center;
  margin-top:15px;
}

.dashboard{
  display:none;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}

.logout{
  background:#d62828;
}

.stat{
  font-size:30px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">

  <div class="box">

    <h1>ABUJAR ONLINE<br>TELEKOM</h1>

    <div class="subtitle">Admin Login</div>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">LOGIN</button>

    <div class="error" id="error"></div>

  </div>

</div>


<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="card">
    <h2>ABUJAR ONLINE TELEKOM</h2>
    <p>Admin Dashboard</p>
    <button class="logout" onclick="logout()">LOGOUT</button>
  </div>

  <div class="card">
    <h3>মোট Users</h3>
    <div class="stat" id="totalUsers">0</div>
  </div>

  <div class="card">
    <h3>মোট Balance</h3>
    <div class="stat" id="totalBalance">0.00</div>
  </div>

  <div class="card">
    <h3>Top Up Requests</h3>
    <div class="stat" id="totalTopups">0</div>
  </div>

  <div class="card">
    <h3>Admin Status</h3>
    <p id="adminStatus">Logged in</p>
  </div>

</div>


<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* SUPABASE SETTINGS */

const SUPABASE_URL = "https://xzprwzgafdjtauxegyfl.supabase.co";

const SUPABASE_KEY = "sb_publishable_57yy4m90MA8sfpeSTowQtg_hNOcKsUq";


const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* LOGIN */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.innerText = "";

  if(!email || !password){
    error.innerText = "Email এবং Password দিন";
    return;
  }

  const { data, error: loginError } =
    await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(loginError){
    error.innerText = loginError.message;
    return;
  }

  showDashboard();

};


/* DASHBOARD */

  document.getElementById("loginPage").style.display = "none";

  document.getElementById("dashboard").style.display = "block";

  await loadData();

}
